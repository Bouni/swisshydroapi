[project]
name = "swisshydroapi"
version = "2.0.0"
description = "A RESTful API for the data of FOEN (hydrodaten.admin.ch) for the usage in Home-Assistant"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142",
    "uvicorn>=0.54",
    "jinja2>=3.1.6",
    "pydantic-settings>=2",
    "xmltodict>=1.0",
    "httpx2>=2.13.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
